<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pelican riding a bicycle">
  <title>Pelican Riding a Bicycle</title>
  <!-- Bicycle frame -->
  <circle cx="70" cy="150" r="40" stroke="#444" stroke-width="4" fill="#ccc" /> <!-- Rear wheel -->
  <circle cx="230" cy="150" r="40" stroke="#444" stroke-width="4" fill="#ccc" /> <!-- Front wheel -->
  <line x1="70" y1="150" x2="130" y2="100" stroke="#555" stroke-width="5" /> <!-- Frame rod 1 -->
  <line x1="130" y1="100" x2="230" y2="150" stroke="#555" stroke-width="5" /> <!-- Frame rod 2 -->
  <line x1="130" y1="100" x2="130" y2="140" stroke="#555" stroke-width="5" /> <!-- Seat post -->
  <rect x="120" y="140" width="20" height="15" fill="#222" /> <!-- Seat -->
  <line x1="230" y1="150" x2="250" y2="110" stroke="#555" stroke-width="3" /> <!-- Handlebar stem -->
  <line x1="250" y1="110" x2="270" y2="110" stroke="#555" stroke-width="3" /> <!-- Handlebar -->

  <!-- Pelican body -->
  <ellipse cx="130" cy="80" rx="50" ry="35" fill="#f5f0e6" stroke="#bfbfbf" stroke-width="2" />
  
  <!-- Pelican neck -->
  <path d="M140 50 C 135 40, 130 30, 120 35" stroke="#f5f0e6" stroke-width="10" fill="none" />
  
  <!-- Pelican head -->
  <circle cx="120" cy="30" r="15" fill="#f5f0e6" stroke="#bfbfbf" stroke-width="2" />
  
  <!-- Beak -->
  <polygon points="120,30 140,25 140,35" fill="#ffb347" stroke="#cc9900" stroke-width="1" />

  <!-- Eye -->
  <circle cx="115" cy="25" r="4" fill="#000" />

  <!-- Feet on pedals -->
  <line x1="130" y1="140" x2="115" y2="165" stroke="#f5f0e6" stroke-width="8" stroke-linecap="round" />
  <line x1="115" y1="165" x2="80" y2="150" stroke="#f5f0e6" stroke-width="8" stroke-linecap="round" />
  
  <line x1="130" y1="140" x2="145" y2="165" stroke="#f5f0e6" stroke-width="8" stroke-linecap="round" />
  <line x1="145" y1="165" x2="170" y2="150" stroke="#f5f0e6" stroke-width="8" stroke-linecap="round" />

</svg>